services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sebtech_hr_bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - ADMINS=${ADMINS}
      - ip=${ip}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
    volumes:
      - ./handlers/users:/app/handlers/users
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bot-network

  redis:
    image: redis:7.0-alpine
    container_name: redis
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bot-network

volumes:
  redis-data:

networks:
  bot-network:
    driver: bridge